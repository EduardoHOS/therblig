name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the floor: bpmnlint CommonJS-requires an ESM-only min-dash,
        # which only resolves where require(esm) is enabled. See docs/FINDINGS.md F6.
        node: ['22.12', '22', '24']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  licence-guard:
    name: licence guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The bpmn.io licence is not OSI-approved: it requires a visible watermark on
      # rendered diagrams. Keeping the core free of those four packages is the whole
      # enterprise-procurement argument, so it is enforced, not trusted. See ADR-009.
      - name: no watermark-licensed packages in the dependency tree
        run: |
          set -e
          found=0
          for pkg in bpmn-js dmn-js form-js cmmn-js; do
            if [ -d "node_modules/$pkg" ]; then
              echo "::error::$pkg is present in the dependency tree. It carries the"
              echo "::error::bpmn.io watermark licence and must not appear in the core."
              found=1
            fi
          done
          exit $found

      # What a consumer installs is the production tree. The bench's devDependencies — the
      # unreleased layouter alpha among them — are ours to carry, not theirs.
      - name: the published package installs and runs
        run: |
          set -e
          npm run types
          tarball=$(npm pack | tail -1)
          work=$(mktemp -d)
          cp "$tarball" bench/corpus/miwg/C.9.0.bpmn "$work/"
          cd "$work"
          npm init -y > /dev/null
          npm install "./$(basename "$tarball")" > /dev/null
          npx treadle lint C.9.0.bpmn
          npx treadle explain C.9.0.bpmn > /dev/null
          if npm ls --omit=dev --all 2>/dev/null | grep -q bpmn-auto-layout; then
            echo "::error::bpmn-auto-layout is back in the production tree. It is an"
            echo "::error::unreleased alpha with no LICENSE file; see ADR-005."
            exit 1
          fi

  corpus-integrity:
    name: corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Every reference model must still parse and validate. If this breaks, either a
      # dependency regressed or a fixture was modified in place — both are serious.
      - run: node bench/scorer/baseline.mjs bench/corpus
